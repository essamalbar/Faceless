# Production overlay for Oracle Cloud (or any remote host).
#
# Adds a cloudflared container that exposes the API over a Cloudflare Tunnel
# so the Flutter app can reach it from anywhere without opening firewall ports.
#
# Usage (on the Oracle VM):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - CLOUDFLARE_TUNNEL_TOKEN set in .env  (from Cloudflare Dashboard → Tunnels)
#   - See docs/DEPLOY-ORACLE.md for the full setup guide.
#
# Ephemeral tunnel alternative (no Cloudflare account needed, ugly URL):
#   Override the command below:
#     command: tunnel --no-autoupdate --url http://api:8000
#   Then remove the CLOUDFLARE_TUNNEL_TOKEN requirement from .env.
#   The URL changes on every restart — not suitable for production.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Named tunnel: token comes from CLOUDFLARE_TUNNEL_TOKEN in .env.
    # The tunnel routes https://api.yourdomain.com → http://api:8000
    # (the hostname mapping is configured in the Cloudflare Dashboard).
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    # cloudflared resolves "api" via the compose network — no extra config needed.
    networks:
      - default
    env_file: .env

networks:
  default:
    driver: bridge

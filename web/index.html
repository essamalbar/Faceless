<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="faceless">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>faceless</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Service worker auto-update — fixes the "users see stale bundle
    after a deploy" problem. Default Flutter SW puts the new version
    into a `waiting` state and won't activate until every tab is
    closed (which never happens in practice — users keep the tab
    open for days). This snippet:
      1. On every page load, asks the registered SW to check for an
         update against the server.
      2. When a new SW finishes installing, tells it skipWaiting()
         so it activates immediately.
      3. When the SW takes control (controllerchange), reloads the
         page once so the user sees the new bundle.

    Together with the auto-skip in the build-time SW, users get the
    new app on their next page load instead of having to hard-refresh
    or open incognito. See scripts/inject-sw-skip-waiting.sh which
    patches flutter_service_worker.js after `flutter build web`.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      let _reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_reloaded) return;
        _reloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.ready.then((reg) => {
          // Force an update check on every page load
          reg.update().catch(() => {});
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                // New SW installed alongside an active one — ask it
                // to take over now instead of waiting for all tabs
                // to close.
                sw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

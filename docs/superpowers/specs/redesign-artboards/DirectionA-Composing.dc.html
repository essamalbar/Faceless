<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Manrope:wght@500;600&display=swap">
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    a { color: #C9A96E; text-decoration: none; } a:hover { color: #E4CE9E; }
    .halo { animation: halo 4s ease-in-out infinite; }
    @keyframes halo { 0%,100% { transform: scale(1); opacity:.55 } 50% { transform: scale(1.08); opacity:.9 } }
    .livewave span { display:block; width:3px; border-radius:3px; background:linear-gradient(180deg,#E4CE9E,#B4915A); transform-origin:center; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
  </style>
</helmet>

<div dir="rtl" style="width:430px; min-height:940px; position:relative; overflow:hidden; background:#0C0B0E; font-family:'Tajawal',system-ui,sans-serif; color:#EFE9DE;">

  <div style="position:absolute; inset:0; background:radial-gradient(80% 46% at 50% 4%, rgba(201,169,110,0.16), transparent 60%); pointer-events:none;"></div>
  <div style="position:absolute; left:-100px; bottom:-150px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(56,92,84,0.16), transparent 66%); pointer-events:none;"></div>
  <div style="position:absolute; inset:0; background:radial-gradient(130% 120% at 50% 45%, transparent 60%, rgba(0,0,0,0.5)); pointer-events:none;"></div>

  <div style="position:relative; padding:54px 26px 40px; display:flex; flex-direction:column; min-height:846px;">

    <!-- TOP BAR (rtl: start = right) -->
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:12.5px; color:#8C8578; letter-spacing:0.02em;">إلغاء</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:600; font-size:11.5px; letter-spacing:0.20em; text-transform:uppercase; color:#EFE9DE; font-family:'Manrope',sans-serif;">Faceless&nbsp;Lab</span>
        <div style="width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,#E4CE9E,#B4915A); box-shadow:0 0 10px rgba(201,169,110,0.65);"></div>
      </div>
    </div>

    <!-- ARTIST COMING ALIVE -->
    <div style="margin-top:54px; display:flex; flex-direction:column; align-items:center; text-align:center;">
      <div style="position:relative; width:118px; height:118px; display:flex; align-items:center; justify-content:center;">
        <div class="halo" style="position:absolute; inset:-6px; border-radius:50%; background:radial-gradient(circle, rgba(228,206,158,0.35), transparent 68%);"></div>
        <div style="position:relative; width:96px; height:96px; border-radius:50%; background:linear-gradient(140deg,#233A44,#2E7A6E); display:flex; align-items:center; justify-content:center; border:1px solid rgba(228,206,158,0.4); box-shadow:0 12px 34px rgba(0,0,0,0.5);">
          <span style="font-family:'Amiri',serif; font-size:44px; color:#F3EEE4;">ن</span>
        </div>
      </div>
      <div style="margin-top:26px; font-size:10.5px; font-weight:700; letter-spacing:0.28em; color:#8C8578;">جارٍ الآن</div>
      <h1 style="margin:14px 0 0; font-family:'Amiri',serif; font-weight:700; font-size:34px; line-height:1.35; color:#F3EEE4;">نَنسِج <span style="color:#E4CE9E;">أغنيتك</span></h1>
      <div style="margin-top:10px; font-size:13.5px; color:#A39C8E;">نور الليل · ليلة في الحي</div>
    </div>

    <!-- LIVING WAVEFORM -->
    <div class="livewave" style="margin-top:40px; display:flex; align-items:center; justify-content:center; gap:4px; height:64px;">
      <span style="height:40%; animation-delay:0s"></span><span style="height:64%; animation-delay:.12s"></span><span style="height:90%; animation-delay:.24s"></span><span style="height:52%; animation-delay:.36s"></span><span style="height:100%; animation-delay:.48s"></span><span style="height:70%; animation-delay:.60s"></span><span style="height:44%; animation-delay:.72s"></span><span style="height:82%; animation-delay:.84s"></span><span style="height:58%; animation-delay:.96s"></span><span style="height:96%; animation-delay:1.08s"></span><span style="height:48%; animation-delay:1.2s"></span><span style="height:76%; animation-delay:1.32s"></span><span style="height:62%; animation-delay:.2s"></span><span style="height:88%; animation-delay:.4s"></span><span style="height:50%; animation-delay:.6s"></span><span style="height:72%; animation-delay:.8s"></span><span style="height:42%; animation-delay:1s"></span><span style="height:66%; animation-delay:.3s"></span>
    </div>

    <!-- PROGRESS STEPS -->
    <div style="margin-top:40px; display:flex; flex-direction:column; gap:2px;">
      <!-- done -->
      <div style="display:flex; align-items:center; gap:13px; padding:12px 4px;">
        <div style="width:22px; height:22px; border-radius:50%; background:rgba(201,169,110,0.14); border:1px solid rgba(201,169,110,0.5); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E4CE9E" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <span style="flex-grow:1; font-size:14.5px; color:#8C8578;">قراءة الفكرة وتحليل الأسلوب</span>
      </div>
      <div style="display:flex; align-items:center; gap:13px; padding:12px 4px;">
        <div style="width:22px; height:22px; border-radius:50%; background:rgba(201,169,110,0.14); border:1px solid rgba(201,169,110,0.5); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E4CE9E" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <span style="flex-grow:1; font-size:14.5px; color:#8C8578;">كتابة الكلمات بالتشكيل الكامل</span>
      </div>
      <!-- active -->
      <div style="display:flex; align-items:center; gap:13px; padding:13px 14px; margin:4px 0; border-radius:14px; background:rgba(201,169,110,0.06); border:1px solid rgba(201,169,110,0.24);">
        <div style="width:22px; height:22px; border-radius:50%; position:relative; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <div class="halo" style="position:absolute; inset:-3px; border-radius:50%; background:radial-gradient(circle, rgba(228,206,158,0.5), transparent 70%);"></div>
          <div style="position:relative; width:9px; height:9px; border-radius:50%; background:#E4CE9E;"></div>
        </div>
        <span style="flex-grow:1; font-size:15px; font-weight:500; color:#F1E7D2;">توليد اللحن والغناء</span>
        <span style="font-size:12px; color:#C9A96E;">٤٠٪</span>
      </div>
      <!-- pending -->
      <div style="display:flex; align-items:center; gap:13px; padding:12px 4px; opacity:0.5;">
        <div style="width:22px; height:22px; border-radius:50%; border:1px solid rgba(238,233,222,0.2); flex-shrink:0;"></div>
        <span style="flex-grow:1; font-size:14.5px; color:#A39C8E;">تصميم غلاف الأغنية</span>
      </div>
      <div style="display:flex; align-items:center; gap:13px; padding:12px 4px; opacity:0.5;">
        <div style="width:22px; height:22px; border-radius:50%; border:1px solid rgba(238,233,222,0.2); flex-shrink:0;"></div>
        <span style="flex-grow:1; font-size:14.5px; color:#A39C8E;">التجميع النهائي</span>
      </div>
    </div>

    <!-- FOOTER NOTE -->
    <div style="margin-top:auto; padding-top:26px; display:flex; align-items:center; justify-content:center; gap:9px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C8578" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>
      <span style="font-size:12.5px; color:#8C8578;">عادةً أقل من ٣ دقائق — سنُعلمك عند الاكتمال</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>

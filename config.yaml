voice:
  provider: elevenlabs           # tier-3 default; falls back to edge_tts if no key
  name: ar-EG-SalmaNeural
  rate: "+0%"
  pitch: "+0Hz"
  elevenlabs_voice_id: jAAHNNqlbAX9iWjJPEtE   # default narrator voice (female)
  elevenlabs_model: eleven_multilingual_v2
  fallback_to_edge_tts: true
  # Per-character routing: writer tags each beat with `speaker`, this map
  # assigns the matching ElevenLabs voice ID. Unknown speakers fall back to
  # `elevenlabs_voice_id` above. There is no lip sync — this just picks the
  # right voice for the line being said over the matching clip.
  character_voices:
    mother: jAAHNNqlbAX9iWjJPEtE     # female (lemon mom, narrator pov)
    grandmother: jAAHNNqlbAX9iWjJPEtE
    wife: jAAHNNqlbAX9iWjJPEtE
    daughter: jAAHNNqlbAX9iWjJPEtE
    son: 127eIvt3Nz57jlNc8P9x        # male (strawberry son)
    father: 127eIvt3Nz57jlNc8P9x
    doctor: 127eIvt3Nz57jlNc8P9x
    neighbor: 127eIvt3Nz57jlNc8P9x
    friend: 127eIvt3Nz57jlNc8P9x     # male (blueberry friend, same age as son)
    enemy: 127eIvt3Nz57jlNc8P9x      # male (dark grape soldier, menacing)
    shadow: 127eIvt3Nz57jlNc8P9x     # male (son's dark alter-ego, deeper voice)
    narrator: jAAHNNqlbAX9iWjJPEtE

script:
  word_count_target: 320
  word_count_tolerance: 60
  enable_critique_pass: true
  repetition_threshold: 0.85
  min_beats: 8
  max_beats: 15
  words_per_beat: 30

flux:
  steps: 4          # 4 for schnell (default model); bump to 25 if switching to dev
  guidance: 3.5
  width: 1280
  height: 720

assemble:
  output_width: 1920
  output_height: 1080
  shot_crossfade_ms: 350       # snappier transitions for dense slideshow (was 800ms)
  music_duck_db: -18
  music_silence_db: -8
  fade_in_s: 1
  fade_out_s: 1

captions:
  burn_in: false
  font: Cairo-Bold
  font_size: 60

kie:
  # Video provider selection. Routes through pipeline/kie.py:
  #   veo3_fast / veo3 / veo3_lite        → /api/v1/veo/generate (legacy path)
  #   kling/v2-1-standard                 → /api/v1/jobs/createTask (unified path)
  #   kling/v2-1-pro                      → same, higher quality
  #   kling-2.6/image-to-video            → same, newer model
  # Pricing (Kie.ai listed rates, May 2026):
  #   veo3_fast              $0.10/sec  (current Veo Fast tier)
  #   veo3                   $0.40/sec  (cinematic Veo)
  #   kling/v2-1-standard    $0.025/sec ($0.125 / 5s)  ← 4x cheaper than Veo Fast
  #   kling/v2-1-pro         $0.05/sec  ($0.25 / 5s)
  #   kling-2.6 (no audio)   $0.056/sec ($0.28 / 5s)
  model: kling/v2-1-pro          # Kling 2.1 Pro at $0.05/s — 2x cheaper than
                                 # Veo Fast, image-to-video with character_sheet
                                 # locked on every clip (the Veo failure mode
                                 # that motivated the switch). Requires
                                 # native_audio=false and ELEVENLABS_API_KEY.
                                 # Other options:
                                 #   veo3_fast              — $0.10/s, Veo legacy
                                 #   kling/v2-1-standard    — $0.025/s, 4x cheaper
                                 #   kling-2.6/image-to-video — $0.056/s, newer family
  num_clips: 5                   # MIN beats — writer picks 5..15 based on story length
  clip_duration_s: 8
  aspect_ratio: "9:16"
  cost_per_second_usd: 0.05      # kling/v2-1-pro pricing. Cost calculations
                                 # auto-adjust per model via _COST_BY_MODEL in
                                 # pipeline/api.py — this field is now mostly
                                 # informational, kept for back-compat.
  max_spend_usd: 13.00           # 15 clips × 8s × $0.10 = $12 max; small buffer
  poll_interval_s: 5
  poll_timeout_s: 300            # Veo timeout; Kling auto-bumps to 600s internally
  flux_model: flux-kontext-pro   # Kie.ai model identifier — also: flux-kontext-max
  flux_cost_per_image_usd: 0.05
  native_audio: false            # Kling has no native audio — ElevenLabs TTS
                                 # generates Arabic narration and we mix it
                                 # into clips during assembly. Set true ONLY
                                 # when switching back to a Veo model.

song:
  # Suno model id. V5_5 is latest (max 8 min, 5000-char prompt, 1000-char style).
  # V4_5 acceptable fallback. V3_5 not acceptable per spec quality bar.
  suno_model: V5_5
  # Per-song flat cost on Kie.ai (USD). Verify against current Kie.ai pricing.
  suno_cost_usd: 0.05
  # Kie.ai Flux model id for covers. flux-kontext-max = highest quality.
  cover_flux_model: flux-kontext-max
  cover_cost_usd: 0.03
  # User-facing price. 1 credit = $0.10 per B3 ledger. Raw cost ~$0.08 ⇒
  # 1 credit covers it + retry-failure margin.
  credits_per_song: 1
  # Cinematic (beat-synced multi-scene video) mode — premium toggle.
  cinematic_credits_per_song: 3
  cinematic_pool_size: 7
  bars_per_cut: 4
  master_pass: false            # Approach B (ffmpeg tonal master) — seam only,
                                # not yet implemented. See spec
                                # 2026-07-27-song-producer-pass.

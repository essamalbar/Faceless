voice:
  name: ar-SA-HamedNeural
  rate: -20%
  pitch: -10Hz

script:
  word_count_target: 320       # 2-min video target (was 2200 for 10-15 min)
  word_count_tolerance: 60
  enable_critique_pass: true
  repetition_threshold: 0.85

flux:
  steps: 4          # 4 for schnell (default model); bump to 25 if switching to dev
  guidance: 3.5
  width: 1280
  height: 720

assemble:
  output_width: 1920
  output_height: 1080
  shot_crossfade_ms: 350       # snappier transitions for dense slideshow (was 800ms)
  music_duck_db: -18
  music_silence_db: -8
  fade_in_s: 1
  fade_out_s: 1

captions:
  burn_in: false
  font: Cairo-Bold
  font_size: 60

kie:
  model: veo-3.1-fast            # Veo 3.1 Fast on Kie.ai; ~$0.10/sec
  num_clips: 4                   # 4 × 7s = 28s narration + 2s holds → 30s final
  clip_duration_s: 7
  aspect_ratio: "9:16"           # vertical for TikTok / Shorts / Reels
  cost_per_second_usd: 0.10      # used for the orchestrator budget guard
  max_spend_usd: 3.50            # hard cap per video — refuses to start if exceeded
  poll_interval_s: 5
  poll_timeout_s: 300            # give up on a clip after 5 min

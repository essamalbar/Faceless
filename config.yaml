voice:
  provider: elevenlabs           # tier-3 default; falls back to edge_tts if no key
  name: ar-EG-SalmaNeural
  rate: "+0%"
  pitch: "+0Hz"
  elevenlabs_voice_id: jAAHNNqlbAX9iWjJPEtE   # default narrator voice (female)
  elevenlabs_model: eleven_multilingual_v2
  fallback_to_edge_tts: true
  # Per-character routing: writer tags each beat with `speaker`, this map
  # assigns the matching ElevenLabs voice ID. Unknown speakers fall back to
  # `elevenlabs_voice_id` above. There is no lip sync — this just picks the
  # right voice for the line being said over the matching clip.
  character_voices:
    mother: jAAHNNqlbAX9iWjJPEtE     # female (lemon mom, narrator pov)
    grandmother: jAAHNNqlbAX9iWjJPEtE
    wife: jAAHNNqlbAX9iWjJPEtE
    daughter: jAAHNNqlbAX9iWjJPEtE
    son: 127eIvt3Nz57jlNc8P9x        # male (strawberry son)
    father: 127eIvt3Nz57jlNc8P9x
    doctor: 127eIvt3Nz57jlNc8P9x
    neighbor: 127eIvt3Nz57jlNc8P9x
    friend: 127eIvt3Nz57jlNc8P9x     # male (blueberry friend, same age as son)
    enemy: 127eIvt3Nz57jlNc8P9x      # male (dark grape soldier, menacing)
    shadow: 127eIvt3Nz57jlNc8P9x     # male (son's dark alter-ego, deeper voice)
    narrator: jAAHNNqlbAX9iWjJPEtE
  # Pool for per-character auto-assignment in freeform mode.
  # run.py hashes (title, character_name) → pool index for stable re-runs.
  # Add more distinct voice IDs here as you acquire them; duplicates are fine
  # today and just reduce variety until you have ≥8 distinct IDs.
  elevenlabs_voice_pool:
    - jAAHNNqlbAX9iWjJPEtE   # female (default narrator)
    - 127eIvt3Nz57jlNc8P9x   # male (default son/father/etc.)
    - jAAHNNqlbAX9iWjJPEtE
    - 127eIvt3Nz57jlNc8P9x
    - jAAHNNqlbAX9iWjJPEtE
    - 127eIvt3Nz57jlNc8P9x

script:
  word_count_target: 320
  word_count_tolerance: 60
  enable_critique_pass: true
  repetition_threshold: 0.85
  min_beats: 8
  max_beats: 15
  words_per_beat: 30

flux:
  steps: 4          # 4 for schnell (default model); bump to 25 if switching to dev
  guidance: 3.5
  width: 1280
  height: 720

assemble:
  output_width: 1920
  output_height: 1080
  shot_crossfade_ms: 350       # snappier transitions for dense slideshow (was 800ms)
  music_duck_db: -18
  music_silence_db: -8
  fade_in_s: 1
  fade_out_s: 1

captions:
  burn_in: false
  font: Cairo-Bold
  font_size: 60

kie:
  model: veo3_fast               # Fast: $0.10/sec; bump to veo3 ($0.40/sec) for cinematic quality
  num_clips: 5                   # MIN beats — writer picks 5..15 based on story length
  clip_duration_s: 8
  aspect_ratio: "9:16"
  cost_per_second_usd: 0.10      # Veo 3 Fast pricing
  max_spend_usd: 13.00           # 15 clips × 8s × $0.10 = $12 max; small buffer
  poll_interval_s: 5
  poll_timeout_s: 300
  flux_model: flux-kontext-pro   # Kie.ai model identifier — also: flux-kontext-max
  flux_cost_per_image_usd: 0.05
  native_audio: true             # Veo speaks each beat's dialogue with native lip sync.
                                 # Skips ElevenLabs. Set false to use the old text-to-speech path.

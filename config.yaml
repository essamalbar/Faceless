voice:
  name: ar-EG-SalmaNeural        # Egyptian female, dramatic — for @sunstoriz-style Shorts
  rate: "+0%"                    # natural conversational pace; edge-tts requires explicit sign
  pitch: "+0Hz"

script:
  word_count_target: 320       # 2-min video target (was 2200 for 10-15 min)
  word_count_tolerance: 60
  enable_critique_pass: true
  repetition_threshold: 0.85

flux:
  steps: 4          # 4 for schnell (default model); bump to 25 if switching to dev
  guidance: 3.5
  width: 1280
  height: 720

assemble:
  output_width: 1920
  output_height: 1080
  shot_crossfade_ms: 350       # snappier transitions for dense slideshow (was 800ms)
  music_duck_db: -18
  music_silence_db: -8
  fade_in_s: 1
  fade_out_s: 1

captions:
  burn_in: false
  font: Cairo-Bold
  font_size: 60

kie:
  model: veo3_fast               # Kie.ai model identifier — also: veo3, veo3_lite
  num_clips: 8                   # 8 × 8s = 64s, matches @sunstoriz ~75s reference
  clip_duration_s: 8             # Veo's actual default — assembler now probes real durations
  aspect_ratio: "9:16"           # vertical for TikTok / Shorts / Reels
  cost_per_second_usd: 0.10
  max_spend_usd: 7.50            # 8 × 8 × $0.10 = $6.40; buffer
  poll_interval_s: 5
  poll_timeout_s: 300

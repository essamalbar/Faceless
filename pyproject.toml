[project]
name = "faceless-pipeline"
version = "0.1.0"
description = "Arabic horror faceless YouTube CLI"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "edge-tts>=6.1.0",
    # mflux is the Apple-Silicon MLX Flux runtime, used only by the
    # long-form (slideshow) pipeline that generates Flux images locally.
    # The shorts pipeline calls Flux via Kie.ai's API, so we don't need
    # mflux on Linux (where it would pull ~5 GB of unnecessary CUDA libs
    # via mlx-cuda transitively). pipeline/images.py lazy-imports mflux
    # inside _get_flux(), so module-import doesn't break on Linux.
    "mflux>=0.4.0; platform_system == 'Darwin'",
    "ffmpeg-python>=0.2.0",
    "pyyaml>=6.0",
    # crypto extras pull in `cryptography` so PyJWT can verify ES256 / RS256
    # signatures. Supabase's new projects sign user access tokens with ES256
    # (P-256 elliptic curve); HS256 stays supported as a fallback for legacy
    # projects and our own service token.
    "pyjwt[crypto]>=2.8",
    # supabase-py: server-side client for the Postgres ledger. Uses
    # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (already in Secret Manager
    # from B2) to bypass RLS for ledger writes.
    "supabase>=2.6",
    # Stripe Python SDK for Hosted Checkout, Customer Portal, and webhook
    # signature verification. We never build payment UIs ourselves — Stripe
    # hosts all card collection / 3DS / SCA flows.
    "stripe>=10.0",
    "Pillow>=10.0",
    "pydub>=0.25",
    "click>=8.1",
    "curl-cffi>=0.15.0",
    # torch: declared as a direct dep so [tool.uv.sources] below can override
    # its source per-platform (CPU wheel on Linux, default MPS wheel on macOS).
    # openai-whisper requires torch transitively; without this declaration the
    # source override would NOT apply.
    "torch>=2.0",
    "openai-whisper>=20240930",
    # librosa: beat/tempo tracking for cinematic (beat-synced) song video.
    # Pulls scipy + numba; torch/numpy already ship for Whisper.
    "librosa>=0.10",
    # yt-dlp: fetch reference audio for YouTube song import. Uses the ffmpeg
    # already in the image to extract audio. NOTE: YouTube blocks datacenter
    # IPs, so this may fail from Cloud Run — handled gracefully downstream.
    "yt-dlp>=2024.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # google-cloud-run: REST/gRPC client for triggering Cloud Run Jobs from
    # the API container. Cleaner than shelling out to `gcloud` (which isn't
    # in the slim Python image anyway), and reuses the container's workload
    # identity so we don't need to mount a service-account key.
    "google-cloud-run>=0.10",
    # PDF export for the free-tier "download your script" feature. fpdf2 +
    # arabic-reshaper + python-bidi are all pure-Python and tiny; we bundle
    # Amiri-Regular.ttf (SIL OFL) in assets/fonts/ for proper Arabic shaping.
    # Picked fpdf2 over weasyprint because weasyprint pulls cairo/pango as
    # system libs, which would balloon the Cloud Run cold-start image.
    "fpdf2>=2.7",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.uv]
package = false

# CPU-only PyTorch on Linux — Cloud Run / Oracle / Docker have no GPU,
# and the default PyPI torch wheel ships ~5 GB of CUDA libraries we'll
# never use. macOS keeps the default (MPS-accelerated) torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "platform_system == 'Linux'" }
